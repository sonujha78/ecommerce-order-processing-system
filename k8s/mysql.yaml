apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  namespace: ecommerce
data:
  schema.sql: |
    CREATE DATABASE IF NOT EXISTS ordersDB;
    USE ordersDB;

    CREATE TABLE products (
        product_id   INT AUTO_INCREMENT PRIMARY KEY,
        name         VARCHAR(255) NOT NULL,
        price        DECIMAL(10,2) NOT NULL,
        stock_qty    INT NOT NULL DEFAULT 0
    );

    CREATE TABLE orders (
        order_id     INT AUTO_INCREMENT PRIMARY KEY,
        customer_id  INT NOT NULL,
        status       ENUM('received','processing','confirmed','failed') NOT NULL DEFAULT 'received',
        created_at   TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE order_items (
        order_item_id INT AUTO_INCREMENT PRIMARY KEY,
        order_id      INT NOT NULL,
        product_id    INT NOT NULL,
        quantity      INT NOT NULL,
        FOREIGN KEY (order_id) REFERENCES orders(order_id),
        FOREIGN KEY (product_id) REFERENCES products(product_id)
    );

    CREATE TABLE order_events (
        event_id    INT AUTO_INCREMENT PRIMARY KEY,
        order_id    INT NOT NULL,
        event_type  VARCHAR(100) NOT NULL,
        payload     JSON NOT NULL,
        created_at  TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (order_id) REFERENCES orders(order_id)
    );

    INSERT INTO products (name, price, stock_qty) VALUES
    ('Wireless Mouse', 799.00, 50),
    ('Mechanical Keyboard', 3499.00, 30),
    ('Last-Item Widget', 199.00, 1);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: MYSQL_DB
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: init-script
          configMap:
            name: mysql-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: ecommerce
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
